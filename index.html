    />
    <title>Freelancer Payment Tracker</title>
    <script>
      // Apply the saved theme before the app loads to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('freelancer-payment-tracker:v1');
          var data = raw ? JSON.parse(raw) : null;
          if (data && data.settings && data.settings.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
